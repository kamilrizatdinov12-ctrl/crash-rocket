<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ GALAXY STARS MULTIPLAYER ⚡</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: #0f1524;
            --bg-input: #172033;
            --tg-star: #fbc02d;
            --accent-blue: #00f0ff;
            --accent-purple: #cc00ff;
            --accent-gold: #ffaa00;
            --accent-green: #00ff66;
            --accent-red: #ff0055;
        }
        body {
            margin: 0; padding: 0; background: var(--bg-main); color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            -webkit-user-select: none; user-select: none; overflow-x: hidden;
        }
        #app-container { width: 100%; max-width: 440px; display: flex; flex-direction: column; padding-bottom: 20px; }
        header {
            display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;
            background: var(--bg-card); border-bottom: 1px solid #1d273d; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .logo { font-weight: 900; font-size: 1.1rem; color: var(--accent-blue); letter-spacing: 0.5px; }
        .balance-box {
            display: flex; align-items: center; gap: 6px; background: var(--bg-input);
            padding: 6px 14px; border-radius: 20px; font-weight: bold; border: 1px solid rgba(251, 192, 45, 0.2);
        }
        .star-icon {
            width: 16px; height: 16px; background: var(--tg-star);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            box-shadow: 0 0 10px var(--tg-star);
        }
        nav { display: flex; gap: 8px; padding: 12px 16px; }
        .nav-btn {
            flex: 1; padding: 10px; border: none; border-radius: 10px; background: var(--bg-card);
            color: #7e8b9b; font-weight: bold; font-size: 0.9rem; cursor: pointer; border: 1px solid transparent;
        }
        .nav-btn.active { background: rgba(0, 240, 255, 0.08); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        .game-screen { display: none; padding: 0 16px; }
        .game-screen.active { display: block; }
        .history-line { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; }
        .history-item { background: #141d30; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; color: var(--accent-blue); }
        .history-item.medium { color: var(--accent-purple); }
        .history-item.high { color: var(--accent-gold); text-shadow: 0 0 6px var(--accent-gold); }
        .crash-viewport { height: 210px; background: #03050a; border-radius: 14px; position: relative; overflow: hidden; border: 1px solid #141d30; }
        #crash-canvas { width: 100%; height: 100%; display: block; }
        #crash-mult-display {
            position: absolute; top: 25px; width: 100%; text-align: center; font-size: 3.2rem;
            font-weight: 900; color: #fff; z-index: 5; text-shadow: 0 4px 12px rgba(0,0,0,0.7);
        }
        #crash-timer-display {
            position: absolute; top: 85px; width: 100%; text-align: center; font-size: 1.1rem;
            font-weight: bold; color: var(--accent-gold); z-index: 5; display: none;
        }
        .controls-card { background: var(--bg-card); padding: 14px; border-radius: 14px; margin-top: 12px; border: 1px solid #141d30; }
        .row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
        .flex-1 { flex: 1; }
        .label { font-size: 0.8rem; color: #7e8b9b; margin-bottom: 4px; text-align: left; }
        input, select {
            width: 100%; box-sizing: border-box; padding: 10px; background: var(--bg-input);
            border: 1px solid #1d273d; border-radius: 8px; color: #fff; font-size: 0.95rem; font-weight: bold;
        }
        .main-btn {
            width: 100%; padding: 14px; border: none; border-radius: 10px; background: var(--accent-green);
            color: #000; font-size: 1.1rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 255, 102, 0.2);
        }
        .main-btn.danger { background: var(--accent-red); color: #fff; box-shadow: 0 4px 12px rgba(255, 0, 85, 0.2); }
        .main-btn.waiting { background: var(--bg-input); color: var(--accent-gold); box-shadow: none; border: 1px solid var(--accent-gold); }
        .main-btn:disabled { background: #141d30; color: #4e5d78; box-shadow: none; cursor: not-allowed; }
        .live-bets { margin-top: 15px; background: var(--bg-card); border-radius: 14px; padding: 12px; border: 1px solid #141d30; }
        .live-title { font-size: 0.8rem; font-weight: bold; color: #7e8b9b; text-align: left; margin-bottom: 8px; display: flex; justify-content: space-between;}
        .bet-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; border-bottom: 1px solid #141d30; font-size: 0.85rem; }
        .bet-row.my-bet-row { background: rgba(0, 240, 255, 0.05); border-left: 3px solid var(--accent-blue); padding-left: 6px; }
        .bet-row.won-row { background: rgba(0, 255, 102, 0.03); }
        .bet-user { font-weight: 600; color: #dbdfeb; display: flex; align-items: center; gap: 6px; }
        .bet-value { display: flex; align-items: center; gap: 4px; font-weight: bold; min-width: 70px; justify-content: flex-end; }
        .bet-mult { color: var(--accent-green); font-weight: bold; background: rgba(0,255,102,0.1); padding: 2px 6px; border-radius: 4px; min-width: 50px; text-align: center;}
        .bet-mult.waiting { color: #7e8b9b; background: var(--bg-input); }
        .bet-mult.crushed { color: var(--accent-red); background: rgba(255,0,85,0.08); }
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 12px 0; background: #03050a; padding: 10px; border-radius: 14px; }
        .mine-tile { aspect-ratio: 1; background: var(--bg-card); border-radius: 8px; border: 1px solid #1d273d; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
        .mine-tile.open-gem { background: rgba(0, 255, 102, 0.1); border-color: var(--accent-green); color: var(--accent-green); }
        .mine-tile.open-bomb { background: rgba(255, 0, 85, 0.1); border-color: var(--accent-red); color: var(--accent-red); }
    </style>
</head>
<body>
<div id="app-container">
    <header>
        <div class="logo">⚡ GALAXY MULTIPLAYER</div>
        <div class="balance-box"><span id="global-balance">1000</span><div class="star-icon"></div></div>
    </header>
    <nav>
        <button id="tab-crash" class="nav-btn active" onclick="switchTab('crash')">🚀 CRASH LIVE</button>
        <button id="tab-mines" class="nav-btn" onclick="switchTab('mines')">💣 MINES</button>
    </nav>
    <div id="screen-crash" class="game-screen active">
        <div class="history-line" id="crash-history">
            <div class="history-item">1.45x</div>
            <div class="history-item medium">2.10x</div>
            <div class="history-item high">14.80x</div>
        </div>
        <div class="crash-viewport">
            <div id="crash-mult-display">1.00x</div>
            <div id="crash-timer-display">До взлета: 5.0с</div>
            <canvas id="crash-canvas"></canvas>
        </div>
        <div class="controls-card">
            <div class="row"><div class="flex-1"><div class="label">Ставка на следующий раунд:</div><input type="number" id="crash-bet" value="10" min="1"></div></div>
            <button id="crash-btn" class="main-btn" onclick="handleCrashAction()">ПОСТАВИТЬ</button>
        </div>
        <div class="live-bets">
            <div class="live-title"><span>Таблица ставок раунда</span><span style="color:var(--accent-blue)">● В эфире</span></div>
            <div id="crash-players-list"></div>
        </div>
    </div>
    <div id="screen-mines" class="game-screen">
        <div class="controls-card" style="margin-top:0; margin-bottom:12px;">
            <div style="font-size:1rem; font-weight:bold; color:var(--accent-blue); text-align:left;" id="mines-status">Настройте мины и ставку</div>
        </div>
        <div class="mines-grid" id="mines-board"></div>
        <div class="controls-card">
            <div class="row">
                <div class="flex-1">
                    <div class="label">Ставка:</div>
                    <input type="number" id="mines-bet" value="10" min="1">
                </div>
                <div class="flex-1">
                    <div class="label">Количество мин:</div>
                    <select id="mines-count">
                        <option value="1">1 мина</option>
                        <option value="3">3 мины</option>
                        <option value="5" selected>5 мин</option>
                        <option value="10">10 мин</option>
                        <option value="15">15 мин</option>
                        <option value="23">23 мины</option>
                    </select>
                </div>
            </div>
            <button id="mines-btn" class="main-btn" onclick="handleMinesAction()">НАЧАТЬ ИГРУ</button>
        </div>
    </div>
</div>

<script>
    let balance = 1000;
    const bEl = document.getElementById('global-balance');
    function setBalance(v) { balance = v; bEl.textContent = balance; }

    function switchTab(tab) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.game-screen').forEach(s => s.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        document.getElementById('screen-' + tab).classList.add('active');
        if(tab === 'crash') resizeCrashCanvas();
    }

    /* ========================================================
       ГРАФИЧЕСКИЙ ДВИЖОК КРАША С НОВОЙ КИБЕРПАНК-РАКЕТОЙ
       ======================================================== */
    const cCanvas = document.getElementById('crash-canvas');
    const cCtx = cCanvas.getContext('2d');
    const cDisplay = document.getElementById('crash-mult-display');
    const cTimerDisplay = document.getElementById('crash-timer-display');
    const cBtn = document.getElementById('crash-btn');
    const cBetInput = document.getElementById('crash-bet');

    let cGameState = "LOBBY"; // LOBBY, FLYING, CRASHED
    let cMult = 1.00, cCrashPoint = 0, cTime = 0, cMainLoop = null;
    let myBetActive = false, myBetAmount = 0, myCashoutX = 0, hasCashoutThisRound = false;

    function resizeCrashCanvas() {
        cCanvas.width = cCanvas.clientWidth; cCanvas.height = cCanvas.clientHeight;
        drawCrashScene();
    }
    window.addEventListener('resize', resizeCrashCanvas);
    setTimeout(resizeCrashCanvas, 150);

    function drawCrashScene() {
        cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
        let w = cCanvas.width, h = cCanvas.height;

        // Рисуем сетку на заднем фоне
        cCtx.strokeStyle = '#0d1322'; cCtx.lineWidth = 1;
        for(let i=0; i<w; i+=40) { cCtx.beginPath(); cCtx.moveTo(i,0); cCtx.lineTo(i,h); cCtx.stroke(); }
        for(let j=0; j<h; j+=40) { cCtx.beginPath(); cCtx.moveTo(0,j); cCtx.lineTo(w,j); cCtx.stroke(); }

        if (cGameState === "FLYING" || cGameState === "CRASHED") {
            // Динамический зум: ракета летит бесконечно, график сжимается
            let zoomX = 1 + (cMult - 1) * 0.45;
            let zoomY = 1 + Math.pow(cMult - 1, 1.15) * 0.35;

            let startX = 35, startY = h - 35;
            let endX = startX + (cTime * 5.2) / zoomX;
            let endY = startY - (Math.pow(cTime, 1.28) * 0.75) / zoomY;

            if (endX > w - 45) endX = w - 45;
            if (endY < 45) endY = 45;

            // Отрисовка неонового графика
            cCtx.beginPath();
            cCtx.strokeStyle = varColor('--accent-blue'); cCtx.lineWidth = 4;
            cCtx.shadowBlur = 15; cCtx.shadowColor = varColor('--accent-blue');
            cCtx.moveTo(startX, startY);
            cCtx.quadraticCurveTo((startX + endX)/2, startY + 5, endX, endY);
            cCtx.stroke();
            cCtx.shadowBlur = 0;

            if (cGameState === "FLYING") {
                // ОТРИСОВКА НОВОЙ КИБЕРПАНК-РАКЕТЫ
                cCtx.save();
                cCtx.translate(endX, endY);
                cCtx.rotate(-Math.PI / 4 + (Math.sin(cTime * 0.25) * 0.03)); // Легкая качка

                // Реактивный огонь
                let flameSize = 14 + Math.random() * 16;
                let flameGrad = cCtx.createLinearGradient(0, 0, -flameSize, 0);
                flameGrad.addColorStop(0, '#ff9100'); flameGrad.addColorStop(0.5, '#ff3d00'); flameGrad.addColorStop(1, 'rgba(255,0,85,0)');
                cCtx.fillStyle = flameGrad; cCtx.beginPath();
                cCtx.moveTo(-16, -5); cCtx.lineTo(-16 - flameSize, 0); cCtx.lineTo(-16, 5); cCtx.fill();

                // Корпус (титановый градиент)
                let bodyGrad = cCtx.createLinearGradient(-15, 0, 15, 0);
                bodyGrad.addColorStop(0, '#bdc3c7'); bodyGrad.addColorStop(1, '#ffffff');
                cCtx.fillStyle = bodyGrad; cCtx.beginPath(); cCtx.ellipse(0, 0, 22, 9, 0, 0, 2 * Math.PI); cCtx.fill();

                // Обтекатель носа (неоново-красный)
                cCtx.fillStyle = varColor('--accent-red'); cCtx.beginPath(); cCtx.ellipse(15, 0, 7, 9, 0, -Math.PI / 2, Math.PI / 2); cCtx.fill();

                // Космические крылья с подсветкой
                cCtx.fillStyle = varColor('--accent-blue');
                cCtx.beginPath(); cCtx.moveTo(-5, -8); cCtx.lineTo(-16, -17); cCtx.lineTo(-3, -8); cCtx.fill();
                cCtx.beginPath(); cCtx.moveTo(-5, 8); cCtx.lineTo(-16, 17); cCtx.lineTo(-3, 8); cCtx.fill();

                // Иллюминатор кабины пилота
                cCtx.fillStyle = '#060913'; cCtx.beginPath(); cCtx.arc(4, 0, 4.5, 0, 2 * Math.PI); cCtx.fill();
                cCtx.strokeStyle = varColor('--accent-blue'); cCtx.lineWidth = 1; cCtx.stroke();
                cCtx.restore();
            } else {
                // АНИМАЦИЯ КРАША (ВЗРЫВ)
                cCtx.save(); cCtx.translate(endX, endY);
                let expGrad = cCtx.createRadialGradient(0, 0, 2, 0, 0, 40);
                expGrad.addColorStop(0, '#fff'); expGrad.addColorStop(0.2, '#ffea00'); expGrad.addColorStop(0.6, '#ff0055'); expGrad.addColorStop(1, 'rgba(0,0,0,0)');
                cCtx.fillStyle = expGrad; cCtx.beginPath(); cCtx.arc(0, 0, 45, 0, 2 * Math.PI); cCtx.fill();
                cCtx.restore();
            }
        }
    }

    function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

    function generateCrashPoint() {
        let rand = Math.random();
        if (rand < 0.04) return 1.00; // Моментальный взрыв (мощный риск)
        let res = 1.01 + (0.96 / (Math.random() + 0.001)) * 0.06;
        return parseFloat(Math.min(300, Math.max(1.01, res)).toFixed(2));
    }
    // АВТОМАТИЧЕСКИЙ ЦИКЛ СЕРВЕРА КРАШ-ИГРЫ
    function runServerTimeline() {
        cGameState = "LOBBY";
        hasCashoutThisRound = false;
        myCashoutX = 0;
        
        cBtn.disabled = false;
        if (myBetActive) {
            cBtn.textContent = "В ИГРЕ (ЖДЕМ ВЗЛЕТ)";
            cBtn.className = "main-btn waiting";
            cBetInput.disabled = true;
        } else {
            cBtn.textContent = "ПОСТАВИТЬ";
            cBtn.className = "main-btn";
            cBetInput.disabled = false;
        }

        let timeLeft = 6.0; // 6 секунд на ставки между раундами
        cTimerDisplay.style.display = "block";
        cTimerDisplay.textContent = `Взлет через: ${timeLeft.toFixed(1)}с`;
        cDisplay.textContent = "1.00x";
        cDisplay.style.color = "#7e8b9b";
        
        generateFakePlayers();
        renderPlayersList();

        let lobbyInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                clearInterval(lobbyInterval);
                cTimerDisplay.style.display = "none";
                launchRocket();
            } else {
                cTimerDisplay.textContent = `Взлет через: ${timeLeft.toFixed(1)}с`;
            }
        }, 100);
    }

    function launchRocket() {
        cGameState = "FLYING";
        cMult = 1.00;
        cTime = 0;
        cCrashPoint = generateCrashPoint();
        cDisplay.style.color = "#fff";

        if (myBetActive) {
            cBtn.textContent = "ЗАБРАТЬ";
            cBtn.className = "main-btn danger";
            cBtn.disabled = false;
        } else {
            cBtn.textContent = "РАУНД ИДЕТ";
            cBtn.disabled = true;
        }

        cMainLoop = setInterval(() => {
            cTime += 0.5;
            
            // Динамический разгон коэффициента
            if (cMult < 2) cMult += 0.01;
            else if (cMult < 5) cMult += 0.03;
            else if (cMult < 20) cMult += 0.15;
            else cMult += 0.65;

            cDisplay.textContent = cMult.toFixed(2) + 'x';
            drawCrashScene();
            
            updateFakePlayers(cMult);
            renderPlayersList();

            if (cMult >= cCrashPoint) {
                clearInterval(cMainLoop);
                cGameState = "CRASHED";
                cDisplay.textContent = 'CRASH @ ' + cCrashPoint.toFixed(2) + 'x';
                cDisplay.style.color = varColor('--accent-red');
                drawCrashScene();
                
                if (myBetActive && !hasCashoutThisRound) {
                    myBetActive = false;
                }

                updateFakePlayers(cCrashPoint);
                renderPlayersList();
                addCrashHistory(cCrashPoint.toFixed(2) + 'x');
                
                setTimeout(() => {
                    myBetActive = false;
                    runServerTimeline();
                }, 3000);
            }
        }, 45);
    }
    function handleCrashAction() {
        if (cGameState === "LOBBY") {
            if (myBetActive) {
                setBalance(balance + myBetAmount);
                myBetActive = false;
                cBtn.textContent = "ПОСТАВИТЬ";
                cBtn.className = "main-btn";
                renderPlayersList();
            } else {
                myBetAmount = parseInt(cBetInput.value);
                if (isNaN(myBetAmount) || myBetAmount <= 0 || balance < myBetAmount) return;
                setBalance(balance - myBetAmount);
                myBetActive = true;
                cBtn.textContent = "В ИГРЕ (ЖДЕМ ВЗЛЕТ)";
                cBtn.className = "main-btn waiting";
                renderPlayersList();
            }
        } else if (cGameState === "FLYING") {
            if (hasCashoutThisRound) return;
            hasCashoutThisRound = true;
            myCashoutX = cMult;
            let win = Math.floor(myBetAmount * myCashoutX);
            setBalance(balance + win);
            cBtn.textContent = `Забрал +${win} 🌟`;
            cBtn.disabled = true;
        }
    }

    function addCrashHistory(txt) {
        let hLine = document.getElementById('crash-history');
        let item = document.createElement('div');
        let num = parseFloat(txt);
        item.className = 'history-item';
        if (num >= 10.0) item.className += ' high';
        else if (num >= 2.0) item.className += ' medium';
        item.textContent = txt;
        hLine.insertBefore(item, hLine.firstChild);
        if (hLine.children.length > 5) hLine.lastChild.remove();
    }

    let fakePlayers = [];
    const botNames = ["Данил", "Артур", "Маша_VIP", "Shark_77", "Guru_Stars", "Kamil_Fan", "Vitek", "Юля_05", "Nikitka", "MinesKing", "CryptoFly"];
    
    function generateFakePlayers() {
        fakePlayers = [];
        let num = 4 + Math.floor(Math.random() * 4);
        for (let i = 0; i < num; i++) {
            let name = botNames[Math.floor(Math.random() * botNames.length)];
            let bet = 5 + Math.floor(Math.random() * 200);
            let targetX = parseFloat((1.1 + Math.random() * 4.5).toFixed(2));
            if (Math.random() < 0.08) targetX = parseFloat((10 + Math.random() * 40).toFixed(2));
            fakePlayers.push({ name: name, bet: bet, x: targetX, active: true, state: "FLYING" });
        }
    }

    function updateFakePlayers(currentX) {
        fakePlayers.forEach(p => {
            if (p.active && currentX >= p.x && p.x <= cCrashPoint) {
                p.active = false; p.state = "WON";
            } else if (p.active && currentX >= cCrashPoint) {
                p.active = false; p.state = "CRASHED";
            }
        });
    }

    function renderPlayersList() {
        let listEl = document.getElementById('crash-players-list');
        listEl.innerHTML = '';

        if (myBetActive) {
            let multText = "В полете...";
            let rowClass = "bet-row my-bet-row";
            let displayVal = Math.floor(myBetAmount * cMult);

            if (hasCashoutThisRound) {
                multText = myCashoutX.toFixed(2) + 'x';
                rowClass = "bet-row my-bet-row won-row";
                displayVal = Math.floor(myBetAmount * myCashoutX);
            } else if (cGameState === "CRASHED") {
                multText = "Взрыв";
                rowClass = "bet-row my-bet-row";
                displayVal = myBetAmount;
            }

            listEl.innerHTML += `<div class="${rowClass}"><span class="bet-user">👑 Ты (Камиль)</span><span class="${hasCashoutThisRound ? 'bet-mult' : (cGameState === 'CRASHED' ? 'bet-mult crushed' : 'bet-mult waiting')}">${multText}</span><span class="bet-value" style="color:var(--accent-blue)">${displayVal} <div class="star-icon"></div></span></div>`;
        }

        fakePlayers.forEach(p => {
            let mText = "В полете...";
            let rClass = "bet-row";
            let curVal = Math.floor(p.bet * cMult);

            if (p.state === "WON") {
                mText = p.x.toFixed(2) + 'x';
                rClass = "bet-row won-row";
                curVal = Math.floor(p.bet * p.x);
            } else if (p.state === "CRASHED") {
                mText = "Взрыв";
                curVal = p.bet;
            }

            listEl.innerHTML += `<div class="${rClass}"><span class="bet-user">👤 ${p.name}</span><span class="${p.state === 'WON' ? 'bet-mult' : (p.state === 'CRASHED' ? 'bet-mult crushed' : 'bet-mult waiting')}">${mText}</span><span class="bet-value">${curVal} <div class="star-icon"></div></span></div>`;
        });
    }

    runServerTimeline();
    /* ========================================================
       ЛОГИКА СИСТЕМЫ ИГРЫ МИНЫ (5х5)
       ======================================================== */
    let mBoard = [], mBombs = [], mIsPlaying = false, mBet = 0, mGemsFound = 0, mTotalBombs = 5;
    const mBoardEl = document.getElementById('mines-board');
    const mStatusEl = document.getElementById('mines-status');
    const mBtn = document.getElementById('mines-btn');
    const mBetInput = document.getElementById('mines-bet');
    const mCountSelect = document.getElementById('mines-count');

    function buildMinesBoard() {
        mBoardEl.innerHTML = '';
        for(let i=0; i<25; i++) {
            let tile = document.createElement('div');
            tile.className = 'mine-tile'; tile.textContent = '🌟';
            tile.setAttribute('data-id', i);
            tile.addEventListener('click', () => clickTile(i));
            mBoardEl.appendChild(tile);
        }
    }
    buildMinesBoard();

    function getMinesMultiplier() {
        if(mGemsFound === 0) return 1.00;
        let n = 25, k = mTotalBombs;
        let mult = 1;
        for(let i=0; i<mGemsFound; i++) { mult *= (n - i) / (n - k - i); }
        return parseFloat(mult.toFixed(2));
    }

    function handleMinesAction() {
        if(!mIsPlaying) {
            mBet = parseInt(mBetInput.value);
            mTotalBombs = parseInt(mCountSelect.value);
            if(isNaN(mBet) || mBet <= 0 || balance < mBet) return;

            setBalance(balance - mBet);
            mIsPlaying = true; mGemsFound = 0;
            mBetInput.disabled = true; mCountSelect.disabled = true;
            mStatusEl.textContent = `Текущий Х: 1.00x`; mStatusEl.style.color = '#fff';
            mBtn.textContent = 'ЗАБРАТЬ (1.00x)'; mBtn.className = 'main-btn danger';

            mBombs = Array(25).fill(false);
            let deployed = 0;
            while(deployed < mTotalBombs) {
                let r = Math.floor(Math.random()*25);
                if(!mBombs[r]) { mBombs[r] = true; deployed++; }
            }
            buildMinesBoard();
            document.querySelectorAll('.mine-tile').forEach(t => t.style.color = '#4e5d78');
        } else {
            let curMult = getMinesMultiplier();
            let win = Math.floor(mBet * curMult);
            setBalance(balance + win);
            mStatusEl.textContent = `🎉 Забрал +${win} 🌟`; mStatusEl.style.color = 'var(--accent-green)';
            revealBoard(true);
            endMinesGame();
        }
    }

    function clickTile(id) {
        if(!mIsPlaying) return;
        let tiles = document.querySelectorAll('.mine-tile');
        let t = tiles[id];
        if(t.classList.contains('open-gem') || t.classList.contains('open-bomb')) return;

        if(mBombs[id]) {
            t.classList.add('open-bomb'); t.textContent = '💥';
            mStatusEl.textContent = '💥 КРАШ! Вы попали на мину!'; mStatusEl.style.color = 'var(--accent-red)';
            revealBoard(false);
            endMinesGame();
        } else {
            t.classList.add('open-gem'); t.textContent = '💎';
            mGemsFound++;
            let curMult = getMinesMultiplier();
            mStatusEl.textContent = `Текущий Х: ${curMult}x`;
            mBtn.textContent = `ЗАБРАТЬ (${Math.floor(mBet * curMult)} 🌟)`;

            if(mGemsFound === (25 - mTotalBombs)) {
                let win = Math.floor(mBet * curMult);
                setBalance(balance + win);
                mStatusEl.textContent = `👑 ИДЕАЛЬНО! Выигрыш +${win} 🌟`; mStatusEl.style.color = 'var(--accent-green)';
                revealBoard(true);
                endMinesGame();
            }
        }
    }

    function revealBoard(won) {
        let tiles = document.querySelectorAll('.mine-tile');
        for(let i=0; i<25; i++) {
            if(mBombs[i]) {
                if(!tiles[i].classList.contains('open-bomb')) { tiles[i].classList.add('open-bomb'); tiles[i].textContent = '💣'; }
            } else {
                if(!tiles[i].classList.contains('open-gem')) { tiles[i].style.color = '#25334a'; tiles[i].textContent = '💎'; }
            }
        }
    }

    function endMinesGame() {
        mIsPlaying = false; mBetInput.disabled = false; mCountSelect.disabled = false;
        mBtn.className = 'main-btn'; mBtn.textContent = 'НАЧАТЬ ИГРУ';
    }
</script>
</body>
</html>
